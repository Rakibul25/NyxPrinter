plugins {
    id "com.android.application"
    id "kotlin-android"
}

group = "net.nyx.nyxprinter.nyx_printer"
version = "1.0"

android {
    namespace = "net.nyx.nyxprinter.nyx_printer"
    compileSdk = 34

    defaultConfig {
        minSdk = 21
    }

    sourceSets {
        main {
            aidl.srcDirs = ['src/main/aidl']
        }
    }

    compileOptions {
        // Updated to a more standard Java 8 for wider compatibility
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    // Add this block if it's missing, it's often needed for Kotlin
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation(fileTree("libs") { include("*.jar", "*.aar") })
    implementation("androidx.appcompat:appcompat:1.6.1")
    implementation("androidx.constraintlayout:constraintlayout:2.1.4")
    implementation("org.aspectj:aspectjrt:1.9.6")
    implementation("com.jakewharton.timber:timber:4.7.1")
    testImplementation("junit:junit:4.13.2")
    testImplementation("org.mockito:mockito-core:5.0.0")
    // Java 8+ API support on lower Android versions
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation("androidx.appcompat:appcompat:1.7.0")
}
